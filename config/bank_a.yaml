# Everything that differs between banks lives in a file like this one.
# A second bank is a new YAML file, not a code change (see bank_b_example.yaml).

source:
  name: bank_a
  file_glob: "batch_*.csv"
  encoding: utf-8
  delimiter: ","
  # the date in the file name orders the files and tells us whether a row arrived late
  batch_date_regex: 'batch_(\d{4}-\d{2}-\d{2})'
  batch_date_format: "%Y-%m-%d"

# canonical field -> header in the file (null = the bank doesn't send it)
columns:
  account_number: account_number
  txn_date: txn_date
  txn_time: txn_time
  description: description
  ref_no: ref_no
  debit: debit
  credit: credit
  balance: balance
  account_type: account_type

formats:
  # tried in order; batch 1 writes 01-08-2026 and batch 2 writes 1/08/2026 for the same day.
  # Don't list a day-first and a month-first format for the same separator.
  date: ["%d-%m-%Y", "%d/%m/%Y"]
  time: ["%H:%M:%S", "%H:%M"]
  decimal_places: 2          # more than this is rejected, never rounded
  decimal_separator: "."
  thousands_separator: null

validation:
  # blank in one of these fields -> quarantined as MISSING_<FIELD>
  required: [account_number, ref_no]

dedup:
  # What makes two rows the same transaction, after normalising. Different ref, time or amount means
  # a different transaction, so legitimate repeats survive.
  # Left out on purpose: balance (restated when a backfill lands), description (free text) and
  # account_type (changes between files for the same account).
  key: [account_number, txn_date, txn_time, ref_no, direction, amount]

backfill:
  # a new row whose date is at least this many days older than its file's batch date is a backfill
  late_after_days: 1
